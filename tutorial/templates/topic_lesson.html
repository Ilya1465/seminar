{% extends '_base_basic.html' %}
{% block headers %}
	{{ block.super }}
	<link rel="stylesheet" type="text/css" href="{{ STATIC_URL }}css/visualizer.css">
	<script type="text/javascript" src="{{ STATIC_URL }}js/ace-editor/ace.js"></script>
	<script type="text/javascript" src="{{ STATIC_URL }}js/editor-setup.js?v=1"></script>
	<script type="text/javascript" src="{{ STATIC_URL }}js/jquery.jsPlumb-1.6.4-min.js"></script>
	<script type="text/javascript" src="{{ STATIC_URL }}js/visualizer.js?v=browser2"></script>
	<script type="text/javascript" src="{{ STATIC_URL }}js/lesson.js?v=3"></script>
{% endblock %}
{% block body %}
<p class="lesson-crumb"><a href="{% url 'topics' %}">Темы</a> · <a href="/topics/{{ topic.slug }}/">{{ topic.title }}</a></p>
<div class="page-header">
<h1>Урок {{ order }} из {{ total }}. {{ tlesson.title }}</h1>
</div>
{% include '_lesson_player.html' with problems_url=problems_url %}
<script src="{{ STATIC_URL }}js/lesson-player.js?v=6"></script>
<script src="{{ STATIC_URL }}js/scratch-blocks.js?v=4"></script>
{% endblock %}
